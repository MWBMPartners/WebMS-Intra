# =============================================================================
# PHP Static Analysis
# =============================================================================
# One job: `php -l` on every PHP file under web/. A syntax error turns it red.
#
# THE PSALM JOB THAT USED TO BE HERE WAS REMOVED on 13 October 2026 (owner's
# decision: "Remove it"). It analysed nothing: it installed Psalm in a
# temporary folder, Psalm stopped with "Could not find any composer
# autoloaders", the step swallowed that with "|| true", wrote an empty report,
# uploaded it, and the job went green. A check that cannot fail is worse than
# no check, because it looks like a pass. Do not bring it back in that shape:
# a Psalm job is worth having only once it really reads the code, and then it
# must be able to fail.
#
# THE NAMES ARE KEPT ON PURPOSE. The workflow is still called "PHP Static
# Analysis" and the job "PHP -l lint", although only the lint is left. A
# branch rule that requires a check finds it by the job's name, and a rule
# that names a check no workflow produces leaves every pull request waiting
# for ever (repo-config-audit.yml exists to catch exactly that). Whether a
# rule names this job could not be looked up when this was written, so
# nothing was renamed. Rename only after checking the branch rules.
#
# The two permissions Psalm's report upload needed (security-events: write
# and actions: read) went with it. This job only reads the checked-out code.
# =============================================================================

name: "PHP Static Analysis"

on:
  push:
    # "rc" is the release-candidate branch, between beta and main (owner,
    # 13 October 2026; see package.yml). It does not exist yet: naming it
    # early changes nothing until somebody makes it.
    branches: [main, rc, beta, alpha]
  pull_request:
    branches: [main, rc, beta, alpha]

permissions:
  contents: read

jobs:
  lint:
    name: PHP -l lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Lint every PHP file
        run: |
          find web -type f -name "*.php" \
            -not -path "*/vendor/*" \
            -not -path "*/_libraries/*" \
            -print0 \
          | xargs -0 -n1 -P4 php -l

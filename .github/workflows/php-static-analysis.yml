# =============================================================================
# PHP Static Analysis
# =============================================================================
# One job: `php -l` on every PHP file under web/. A syntax error turns it red.
#
# THE PSALM JOB THAT USED TO BE HERE WAS REMOVED on 13 October 2026 (owner's
# decision: "Remove it"). It analysed nothing: it installed Psalm in a
# temporary folder, Psalm stopped with "Could not find any composer
# autoloaders", the step swallowed that with "|| true", wrote an empty report,
# uploaded it, and the job went green. A check that cannot fail is worse than
# no check, because it looks like a pass. Do not bring it back in that shape:
# a Psalm job is worth having only once it really reads the code, and then it
# must be able to fail.
#
# THE NAMES ARE KEPT ON PURPOSE, AND NOW IT IS NOT A PRECAUTION — IT IS A
# FACT. The workflow is still called "PHP Static Analysis" and the job
# "PHP -l lint", although only the lint is left. A branch rule that requires a
# check finds it by the job's NAME, and a rule naming a check no workflow
# produces leaves every pull request waiting for ever
# (repo-config-audit.yml exists to catch exactly that).
#
# **Since 3 November 2026 the ruleset "Protect main branch" REQUIRES
# `PHP -l lint` by that exact name** (#474), so nothing may reach the live
# branch until this job is green. This header used to say that whether a rule
# named this job "could not be looked up"; it has been looked up.
#
# **SO DO NOT RENAME THIS JOB, AND DO NOT TURN IT INTO A MATRIX.** A matrix
# would make the check names "PHP -l lint (8.4)" and "PHP -l lint (8.5)", the
# required name would match nothing, and every pull request into `main` would
# wait for a check that never arrives. That is why the two PHP versions below
# are two STEPS in one job rather than two jobs. If the name ever has to
# change, change the ruleset in the same action and run
# `python3 tools/audit-required-checks.py`.
#
# The two permissions Psalm's report upload needed (security-events: write
# and actions: read) went with it. This job only reads the checked-out code.
# =============================================================================

name: "PHP Static Analysis"

on:
  push:
    # "rc" is the release-candidate branch, between beta and main (owner,
    # 13 October 2026; see package.yml). It does not exist yet: naming it
    # early changes nothing until somebody makes it.
    branches: [main, rc, beta, alpha]
  pull_request:
    branches: [main, rc, beta, alpha]

permissions:
  contents: read

jobs:
  lint:
    name: PHP -l lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # ====================================================================
      # BOTH PHP VERSIONS THE PORTAL SUPPORTS, as two steps in one job (#475).
      #
      # 8.4.0 is `PhpRuntime::MIN_PHP` — the oldest the portal runs on — and
      # 8.5 is `PhpRuntime::PREFERRED_SERIES`, the one it recommends. Until
      # 3 November 2026 **only 8.4 was linted anywhere in this workflow**, so
      # the recommended version was never checked by the gate that exists to
      # stop a syntax error reaching a customer.
      #
      # Why two steps and not a matrix: see the note at the top of this file —
      # a matrix renames the check and orphans the branch rule that requires
      # it.
      #
      # `php -l` judges by its exit code, which is 0 for a DEPRECATION, so
      # this will not go red merely because 8.5 deprecated something. It
      # catches syntax that one version accepts and the other does not —
      # which is the whole reason to run it twice.
      # ====================================================================
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Lint every PHP file on PHP 8.4 (the oldest supported)
        run: |
          find web -type f -name "*.php" \
            -not -path "*/vendor/*" \
            -not -path "*/_libraries/*" \
            -print0 \
          | xargs -0 -n1 -P4 php -l

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
      - name: Lint every PHP file on PHP 8.5 (the recommended version)
        run: |
          # ASSERT THE SWITCH REALLY HAPPENED. `php -v` printing on its own
          # checks nothing: if setup-php ever stopped switching the active
          # version, this step would lint on 8.4 a second time, print "8.4" and
          # stay green — a step that looks like coverage and is a duplicate.
          # Raised by an independent check on 4 November 2026.
          php -v
          php -r 'exit(PHP_MAJOR_VERSION === 8 && PHP_MINOR_VERSION === 5 ? 0 : 1);' \
            || { echo "::error::Expected PHP 8.5 to be active here, got $(php -r 'echo PHP_VERSION;')"; exit 1; }
          find web -type f -name "*.php" \
            -not -path "*/vendor/*" \
            -not -path "*/_libraries/*" \
            -print0 \
          | xargs -0 -n1 -P4 php -l

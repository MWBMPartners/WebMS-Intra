# =============================================================================
# WebMS-Intra — PR Security Checks
#
# Copyright (c) 2026 MWBM Partners Ltd. All rights reserved.
# Proprietary. Unauthorised copying, modification or distribution prohibited.
#
# PURPOSE
# -------
# Defence-in-depth security gate that runs on every PR targeting alpha,
# beta, or main. Each step is non-blocking EXCEPT the PHP lint step and the
# account-change guard, which are hard gates. "Non-blocking" is done by the
# step's own script, which reports what it found and ends with a success
# status; NO STEP HERE USES continue-on-error (the three that did lost it on
# 13 October 2026: see the note above "Install gitleaks CLI").
# (Codex catch-up A3, 20 September 2026: the account-change guard used to
# run only inside the non-blocking heuristic step below, with its own
# exit code thrown away by "|| true" — so a real finding could never fail
# a build, even though the check documents itself as always-blocking. It
# now ALSO runs a second time, near the end of this file, with its exit
# code honoured.) A summary comment is posted on the PR with any findings.
#
# Checks performed:
#   1. PHP lint (hard gate)                       — syntax error blocks merge
#   2. Secrets scan (gitleaks)                    — high-confidence credentials
#   3. SQL-injection heuristic grep                — $_GET/POST/REQUEST inside query strings
#   4. XSS heuristic grep                          — echo of user input without htmlspecialchars
#   5. CSRF heuristic grep                         — POST forms without csrf_token field
#   6. Hardcoded-paths sanity check                — absolute /Users / /home paths in code
#   7. Dangerous PHP functions                     — eval, exec, shell_exec, system, passthru
#   8. Server-managed dirs touched?                — flag if PR touches _auth_keys/_uploads/_backups
#   9. SQL column-name mismatches                  — runtime INSERT col not in CREATE TABLE
#  10. Route targetFile existence                  — tblRoutes.targetFile resolves to a file
#  11. Settings key consistency                    — $SETTINGS reads vs tblSettings seed
#  12. full_schema.sql fresh-install parity        — migration seeds/marks vs full_schema.sql
#  13. MariaDB-only DDL syntax                      — IF [NOT] EXISTS on ADD/DROP COLUMN,
#                                                       ADD/CREATE/DROP INDEX|KEY (MySQL 8
#                                                       rejects with error 1064)
#  14. PHP table-reference existence                 — tblX referenced in PHP resolves to a
#                                                       CREATE TABLE in full_schema.sql
#  15. mysqli bind_param() arity                      — literal type-string length matches
#                                                       bound-argument count (mismatch throws
#                                                       an uncaught ValueError on PHP 8)
#  21. AccountGuard on account writes — HARD GATE      — a change to an account or the access
#                                                       it carries, written without asking
#                                                       AccountGuard first (the #518 shape);
#                                                       runs once inside the heuristic scan
#                                                       below for the PR comment, and once
#                                                       more near the end of this file as a
#                                                       real hard gate (Codex catch-up A3)
#  22. Event queries with no visibility rule            — a line that reads tblEvents with
#                                                       neither Portal\Core\EventVisibility::
#                                                       nearby nor an "externalFeedID IS
#                                                       [NOT] NULL" refusal (#514 D5 — an
#                                                       imported event must stay read-only
#                                                       everywhere else in the portal).
#                                                       Reported in the PR comment only; not
#                                                       a hard gate (fix round 1, #514 P3,
#                                                       checker finding 3 — corrected here so
#                                                       this header never overstates what the
#                                                       step below actually does).
#  23. Links that point at an ordinary index         — a foreign key whose target is not a
#                                                       primary or unique key; MySQL 8.4
#                                                       refuses it (ERROR 6125, #552). Runs
#                                                       as its OWN step (see below), so it is
#                                                       never skipped by the early exit that
#                                                       skips checks 9-22 above on a pull
#                                                       request with no changed PHP file.
#                                                       Reported in the PR comment only; a
#                                                       crash or a missing file gets its own
#                                                       section there, never silence.
#  24. What the portal's own backup can carry        — every column type and link in the
#                                                       install script, and the snapshot
#                                                       format against its two schema files
#                                                       (#577). Its OWN step, like 23, and
#                                                       reported in the PR comment only; the
#                                                       workflow that turns red on a backup
#                                                       fault is backup-selftest.yml.
#
# Six more checks joined the heuristic scan on 13 October 2026 (owner's
# approvals of 12 and 13 October). All six are reported in the PR comment
# only, and each is numbered after the older check it sits beside:
#  10e. Addresses written without the address builder — a bare "/page", which drops the
#                                                       organisation's part of the address
#                                                       (#536)
#  10f. A web address of ours built in                 — every address must be a setting (#500)
#  10g. Files a package may not hold                   — what git holds under web/, against
#                                                       the installation package's own rules
#                                                       (#499)
#  10h. Addresses written out that nothing answers     — a link, a form or a redirect to an
#                                                       address the portal does not register
#  12b. A secret stored as readable text in a seed     — a seeded secret must be empty, and no
#                                                       seed may overwrite a stored one (#497)
#  14b. A document naming a table that does not exist — the guides under docs/ against
#                                                       full_schema.sql
#
# These are HEURISTICS — false positives are expected. Review the findings,
# don't blindly fail the merge.
#
# Checks 9-11 (cross-source consistency) were added after a sequence of
# missed-bug rounds (#169 → #171 → #198 → #201/202/204/205/206/207 →
# #213): each was a category of "code references something that doesn't
# exist in another source" — a class the prior heuristics didn't cover.
# Check 12 (#364 / #194 / #339) was added after a similar audit found
# fresh installs missing every seed row from migrations 090-145 because
# full_schema.sql's tblMigrations seed block only recorded through 089.
# Check 13 (#<fix-issue> — SQL portability audit) was added after
# confirming MariaDB's `IF [NOT] EXISTS` DDL extensions (used throughout
# web/_sql/) are parse errors (1064) on the confirmed-production MySQL 8.0
# engine; the fix is the information_schema + PREPARE guard idiom (see
# DEV_NOTES.md → "Portable DDL convention"; house examples: migrations
# 037/112/138).
# Check 14 was added because check_sql_columns.py only ever parsed .sql
# files — a wrong table name hard-coded straight into a PHP query string
# was invisible to every prior check, and that exact gap let the GDPR
# eraser silently skip a real table.
# Check 15 (#433) was added after finding two live bind_param() calls
# whose type-string length didn't match the bound-argument count — a
# ValueError PHP 8 throws uncaught (it isn't a mysqli_sql_exception, so
# the repo-wide mysqli_report STRICT setting doesn't catch it), fatally
# 500ing the calendar occurrence-override save and task creation.
# Check 16 (#494) was added after four pages called methods that do not
# exist - Site::name(), Captcha::renderWidget(), Captcha::verifyFromPost() -
# or used a core class without an import (Auth:: on the Activity Log). Each
# is a fatal error the moment that line runs. Several sat AFTER the page's
# not-found handling, so a wrong address behaved correctly while a VALID one
# returned an error page; every event address in the sitemap was one. No
# earlier check reads a method name at all, and there is no autoloader to
# catch it, so it had shipped unnoticed.
# Check 22 (#514) was added because #514 gave the portal one shared rule for
# who may see an event, and made every event copied in from an outside
# calendar read-only everywhere else — but neither promise is enforced by
# the database itself. An ordinary "SELECT ... FROM tblEvents" compiles and
# runs whether or not it carries the rule or the refusal. This check flags
# any line that reads tblEvents with neither nearby, so a future page that
# forgets the rule is caught before it merges rather than found by a leak.
# Check 23 (#552) runs as its OWN step, not inside the heuristic scan
# above, so it is never skipped by that step's early exit — checks 9-22
# above ARE skipped whenever a pull request changes neither a PHP file
# under web/ nor anything under web/_sql/. (Until #556 they were skipped
# on any pull request with no PHP change, so a pull request holding only
# a migration had none of the SQL checks run on it. And since 13 October
# 2026 a pull request that changes only documents runs the two checks
# that read documents, 10f and 14b, and no other.) MySQL 8.4, as it is
# set up out of the box, refuses a link between tables (a foreign key)
# whose target is an ordinary index rather than a primary or unique key,
# while MySQL 8.0 allows it. Three such links reached this project
# unnoticed and would have stopped both a fresh install and an upgrade on
# 8.4 (#552). The script reads the SQL as text, so it needs no database
# and takes about a second — cheap enough to run on every pull request,
# including one that changes only a migration file and no PHP.
# The scripts live in tools/audit-checks/ and are runnable locally.
# =============================================================================

name: PR Security Checks

on:
  pull_request:
    # "rc" is the release-candidate branch, between beta and main (owner,
    # 13 October 2026; see package.yml). It does not exist yet: naming it
    # early changes nothing until somebody makes it.
    branches:
      - main
      - rc
      - beta
      - alpha

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-security-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security:
    name: Static security checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # =====================================================================
      # 1) PHP lint — HARD GATE
      # =====================================================================
      - name: PHP lint (hard gate)
        id: php_lint
        run: |
          echo "::group::PHP syntax check"
          find ./web -type f -name "*.php" \
            -not -path "*/vendor/*" \
            -not -path "*/_libraries/*" \
            -print0 \
          | xargs -0 -n1 -P4 php -l
          echo "::endgroup::"

      # =====================================================================
      # 2) Secrets scan via gitleaks (CLI binary, not the action)
      #
      # We deliberately avoid gitleaks/gitleaks-action@v2 because it
      # requires a paid GITLEAKS_LICENSE secret for organisation accounts.
      # The gitleaks CLI itself is MIT-licensed and free to use directly.
      # Bonus: this also avoids the deprecated Node.js 20 warning that
      # the action emits.
      #
      # WHICH VERSION, AND WHAT VOUCHES FOR IT (13 October 2026). 8.30.1,
      # the version the installation package's own search was proved with,
      # checked against the publisher's own checksum for the one file this
      # step downloads (the line for gitleaks_8.30.1_linux_x64.tar.gz in
      # gitleaks_8.30.1_checksums.txt on that release's page). It used to be
      # 8.21.2 with no checksum at all, so whatever that address served was
      # run. package.yml and portal-selftests.yml install the same version
      # by the same checksum: CHANGE ALL THREE TOGETHER.
      #
      # NO continue-on-error, HERE OR ANYWHERE IN THIS FILE. This step, the
      # scan below it and the heuristic scan each carried that key until
      # 13 October 2026. What it did for this step is now done in the open:
      # a download that fails, a checksum that does not match, or a program
      # that is not the version asked for no longer makes the step "fail
      # but carry on". The step says so in an error line, records
      # installed=no, and ends with a success status, and the job's summary
      # then says in words that NOTHING SEARCHED THIS PULL REQUEST FOR
      # SECRETS. The pull request is not blocked by it, exactly as before:
      # nothing about gitleaks has ever blocked a merge here.
      # WHAT WAS REJECTED: simply deleting the key. A failed download would
      # then have turned the whole job red, and the heuristic scan below
      # (which runs only while every earlier step has succeeded) would have
      # been skipped with it, on the word of somebody else's server.
      # The commands run inside ( … ) with "stop at the first failure"
      # switched on in there only, so the first one that fails ends the
      # group and nothing after it runs: a file whose checksum does not
      # match is never unpacked.
      # =====================================================================
      - name: Install gitleaks CLI
        id: install_gitleaks
        run: |
          set +e
          VERSION="8.30.1"
          SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          (
            set -e
            curl -fsSL "$URL" -o /tmp/gitleaks.tgz
            echo "${SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
            tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
            sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
            INSTALLED="$(gitleaks version)"
            echo "gitleaks says it is version ${INSTALLED}"
            [[ "$INSTALLED" == "$VERSION" || "$INSTALLED" == "v$VERSION" ]]
          )
          INSTALL_RC=$?
          if [[ "$INSTALL_RC" -eq 0 ]]; then
            echo "installed=yes" >> "$GITHUB_OUTPUT"
          else
            echo "installed=no" >> "$GITHUB_OUTPUT"
            echo "::error::gitleaks ${VERSION} was NOT installed: the download failed, or its checksum did not match, or the program is not the version asked for (the lines above say which). THE SEARCH FOR SECRETS DID NOT RUN on this pull request."
          fi

      # No continue-on-error: with `set +e` and no `exit`, this step ends
      # with a success status whatever gitleaks found, as it always did.
      - name: Scan for committed secrets (gitleaks)
        id: gitleaks
        if: steps.install_gitleaks.outputs.installed == 'yes'
        run: |
          set +e
          # `detect` scans the working tree + commits since the PR base.
          # --no-banner keeps the log readable; --redact stops actual
          # secret values appearing in the run log; --report-format sarif
          # gives a structured artifact we can upload.
          gitleaks detect \
            --source . \
            --log-opts "${{ github.event.pull_request.base.sha }}..${{ github.sha }}" \
            --no-banner \
            --redact \
            --report-path /tmp/gitleaks-report.sarif \
            --report-format sarif \
            --exit-code 1
          EXIT=$?
          echo "exit_code=$EXIT" >> "$GITHUB_OUTPUT"
          if [ "$EXIT" -ne 0 ]; then
            echo "::warning::gitleaks reported findings — review the SARIF artifact and the log above"
          fi

      - name: Upload gitleaks SARIF
        if: always() && steps.gitleaks.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: /tmp/gitleaks-report.sarif
          if-no-files-found: ignore
          retention-days: 30

      # =====================================================================
      # 3-8) Custom heuristic grep checks
      #
      # No continue-on-error (removed 13 October 2026; it changed nothing):
      # the script starts with `set +e`, leaves early only with `exit 0`,
      # and its last command cannot fail, so this step ends with a success
      # status whatever any check in it does.
      # =====================================================================
      - name: Heuristic anti-pattern scan
        id: heuristics
        run: |
          set +e
          REPORT=/tmp/security-report.md
          : > "$REPORT"

          # Files changed in this PR (vs. base)
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.sha }}"
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- 'web/**/*.php' 2>/dev/null || true)
          # SQL files too (#556). Checks 9 to 22 below read the whole
          # repository, web/_sql/ included, and never look at $CHANGED. So
          # leaving early on "no PHP file changed" skipped the migration
          # checks on exactly the pull requests that change only a
          # migration. $CHANGED itself stays PHP-only on purpose: checks 3
          # to 8 grep the files it names for PHP mistakes, and do nothing
          # when it is empty.
          CHANGED_SQL=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- 'web/_sql/**' 2>/dev/null || true)
          # Documents too (13 October 2026). Two blocks below read documents:
          # 10f (a web address of ours, in any text file) and 14b (a document
          # under docs/ that names a table that does not exist). A pull
          # request that changed ONLY documents used to leave early here, so
          # 14b never ran on the one kind of change it is for. Such a pull
          # request now runs THOSE TWO BLOCKS AND NO OTHER: every other check
          # below reads PHP or SQL, which it did not change. Nothing else
          # about when this scan runs has changed. "A document" is a file
          # whose name ends in .md, anywhere in the repository.
          CHANGED_DOCS=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- '*.md' 2>/dev/null || true)

          # WHAT THE SCAN DID is written down as "scope" (none, documents or
          # all), so that the comment and the summary further down can say
          # only what happened instead of guessing it from a count.
          if [[ -z "$CHANGED" && -z "$CHANGED_SQL" && -z "$CHANGED_DOCS" ]]; then
            echo "No PHP or SQL file under web/ and no document changed — skipping heuristic checks"
            echo "no_changes=true" >> "$GITHUB_OUTPUT"
            echo "scope=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Scanning these PHP files changed in this PR:"
          echo "${CHANGED:-(none)}"
          echo
          echo "SQL files changed in this PR (they make the whole-repository checks run):"
          echo "${CHANGED_SQL:-(none)}"
          echo

          HITS=0
          add_section() {
            local title="$1"
            local body="$2"
            if [[ -n "$body" ]]; then
              {
                echo "### $title"
                echo
                echo '```'
                echo "$body"
                echo '```'
                echo
              } >> "$REPORT"
              HITS=$((HITS + 1))
            fi
          }

          # The two blocks that read documents. They are written here, as
          # functions, because they are run from two places: by themselves
          # on a pull request that changed only documents (just below), and
          # in their usual places among the other checks on every other one.
          # Their wiring is explained beside 10e, further down.

          # 10f) A web address of ours built into the product (#500). Every
          #      address must come from a setting, the installer, or a GitHub
          #      secret or variable. --strict also fails while the list of
          #      lines waiting for an approved change holds anything, and the
          #      check fails by itself on an entry of that list whose line is
          #      gone. Exit 0 pass; 1 fail.
          block_10f_an_address_of_ours() {
            local out rc
            out=$(python3 tools/audit-checks/check_no_hardcoded_domains.py --strict 2>&1)
            rc=$?
            if [[ "$rc" -eq 1 ]] && echo "$out" | grep -a -q '^Result: FAIL\. The check reached its end\.$'; then
              add_section "A web address of ours is built in, or the list of lines waiting for a change is out of date (every address must be a setting)" "$out"
            elif [[ "$rc" -ne 0 ]]; then
              add_section "check_no_hardcoded_domains.py did not finish (exit code $rc): its findings, if any, are unknown" "${out:-(the script printed nothing at all)}"
            fi
          }

          # 14b) A document under docs/ that names a table that does not
          #      exist. Somebody following a guide to the letter then runs a
          #      query against a table that is not there. Wired exactly like
          #      check 9 below: without --strict (not passed here) the script
          #      exits 0 with or without findings and prints a bullet for each
          #      one, so any other exit code means it did not finish (2 is its
          #      own refusal: no table, or no document, could be read).
          block_14b_documents_naming_tables() {
            local out rc
            out=$(python3 tools/audit-checks/check_docs_table_refs.py 2>&1)
            rc=$?
            if [[ "$rc" -ne 0 ]]; then
              add_section "check_docs_table_refs.py did not finish (exit code $rc): its findings, if any, are unknown" "${out:-(the script printed nothing at all)}"
            elif echo "$out" | grep -a -q '•'; then
              add_section "Documents naming a table that does not exist" "$out"
            fi
          }

          # A pull request that changed only documents: those two, and stop.
          if [[ -z "$CHANGED" && -z "$CHANGED_SQL" ]]; then
            echo "Only documents changed in this PR, so only the two checks that read documents run (10f and 14b):"
            echo "$CHANGED_DOCS"
            echo
            block_10f_an_address_of_ours
            block_14b_documents_naming_tables
            echo "hits=$HITS" >> "$GITHUB_OUTPUT"
            echo "scope=documents" >> "$GITHUB_OUTPUT"
            echo "Total finding sections: $HITS"
            if [[ -s "$REPORT" ]]; then
              cat "$REPORT"
            fi
            exit 0
          fi

          # ---- 3) SQL injection heuristic --------------------------------
          # mysqli->query or mysqli_query with string interpolation of $_GET/POST/REQUEST/COOKIE
          SQLI=$(echo "$CHANGED" | xargs -r grep -nE '(mysqli_query|->query)\s*\(\s*[^,)]*\$_(GET|POST|REQUEST|COOKIE)' 2>/dev/null || true)
          add_section "SQL injection candidates (mysqli->query / mysqli_query with \$_GET/POST/REQUEST/COOKIE)" "$SQLI"

          # ---- 4) XSS heuristic -------------------------------------------
          # echo or print of $_GET/POST/REQUEST/COOKIE without sanitisation
          # on the same line. Lines are EXCLUDED if they contain any of:
          #
          #   • htmlspecialchars / htmlentities / h(          — explicit escapers
          #   • (int) / (integer) / (float) / (double) / (bool) / (boolean)
          #     — PHP type casts that produce values incapable of carrying
          #       markup (the matched bytes are guaranteed to be 0-9, -, .,
          #       or empty for bool/int casts)
          #   • intval( / floatval( / boolval(              — function equivalents
          #
          # These suppressions stop the heuristic firing on idioms like
          # `value="<?php echo (int) ($_POST['db_port'] ?? 3306); ?>"`
          # which are safe by construction.
          XSS=$(echo "$CHANGED" | xargs -r grep -nE '(echo|print)\s+[^;]*\$_(GET|POST|REQUEST|COOKIE)' 2>/dev/null \
              | grep -vE 'htmlspecialchars|htmlentities|h\(|\(int\)|\(integer\)|\(float\)|\(double\)|\(bool\)|\(boolean\)|intval\(|floatval\(|boolval\(' || true)
          add_section "Possible unescaped output of user input" "$XSS"

          # ---- 5) CSRF heuristic -----------------------------------------
          # form method=post lacking any csrf_token reference anywhere in
          # the file.
          #
          # Files under web/_install/ are EXCLUDED — the installation
          # wizard runs before bootstrap.php loads (no Auth::csrfToken()
          # available), is single-use (locks itself with _auth_keys/.installed
          # on completion), and is a documented architectural exception.
          # Confirmed safe at PR #170 review.
          CSRF_FILES=$(echo "$CHANGED" | xargs -r grep -lE '<form[^>]*method\s*=\s*["'\'']?post' 2>/dev/null \
              | grep -vE '^web/_install/' || true)
          CSRF_MISSING=""
          for f in $CSRF_FILES; do
            if ! grep -qE 'csrf_token|csrf\b' "$f"; then
              CSRF_MISSING="${CSRF_MISSING}${f}: contains <form method=POST> but no csrf_token field found"$'\n'
            fi
          done
          add_section "POST forms without an apparent CSRF token field" "$CSRF_MISSING"

          # ---- 6) Hardcoded absolute paths -------------------------------
          PATHS=$(echo "$CHANGED" | xargs -r grep -nE "(['\"])(/Users/|/home/[^/]+/|C:\\\\)" 2>/dev/null || true)
          add_section "Hardcoded absolute filesystem paths (use PORTAL_ROOT / DIRECTORY_SEPARATOR instead)" "$PATHS"

          # ---- 7) Dangerous PHP functions --------------------------------
          DANGER=$(echo "$CHANGED" | xargs -r grep -nE '\b(eval|exec|shell_exec|system|passthru|popen|proc_open)\s*\(' 2>/dev/null || true)
          add_section "Dangerous PHP functions (review carefully — only allow if user input is fully sanitised)" "$DANGER"

          # ---- 8) Server-managed dirs touched? ---------------------------
          SERVER_TOUCH=$(echo "$CHANGED" | grep -E '^web/(_auth_keys|_uploads|_backups)/' || true)
          add_section "PR touches server-managed dirs (_auth_keys / _uploads / _backups) — confirm this is intentional" "$SERVER_TOUCH"

          # ---- 9-11) Cross-source consistency checks ---------------------
          # These run regardless of changed-file scope because they validate
          # the WHOLE repo state — e.g. a settings-key read could be in an
          # unchanged file, but a tblSettings INSERT removal in this PR
          # could orphan it. Each script exits 0 even on findings (we
          # surface in the report; PHP lint remains the only hard gate).

          # 9) SQL column-name mismatches (catches #198, #201, #213 classes)
          #    The whole output goes into the comment, on purpose. This step
          #    used to keep it from line 5 onward (`tail -n +5`), to drop the
          #    two summary lines. Line 4 was the first finding's heading
          #    ("### SELECT-WHERE column-name mismatches (1)"), so every
          #    comment with findings lost it. A fixed line count breaks
          #    silently whenever the script's layout changes; passing
          #    everything cannot drop anything. The summary lines and the
          #    coverage figures after the findings are worth reading anyway.
          #    The exit code is kept too. Without --strict (not passed here)
          #    the script exits 0 with or without findings, so a non-zero exit
          #    means it did not finish: a crash, or one of its own refusals
          #    (coverage figures that do not add up, or a search pattern it
          #    cannot use). Until 16 September 2026 the exit code was thrown
          #    away (`|| true`) and only a `•` in the output earned a section,
          #    so a crash printed a traceback with no `•` and looked exactly
          #    like a clean run. Now a non-zero exit always earns a section,
          #    output or not. `set +e` above means the failing command does
          #    not stop this step, and nothing here blocks the merge.
          SQL_COLS=$(python3 tools/audit-checks/check_sql_columns.py 2>&1)
          SQL_RC=$?
          if [[ "$SQL_RC" -ne 0 ]]; then
            add_section "check_sql_columns.py did not finish (exit code $SQL_RC): its findings, if any, are unknown" "${SQL_COLS:-(the script printed nothing at all)}"
          elif echo "$SQL_COLS" | grep -q '•'; then
            add_section "SQL column-name mismatches (runtime INSERT/SELECT references column not in schema)" "$SQL_COLS"
          fi

          # 10) Route targetFile existence (catches #202, #205 classes)
          ROUTES=$(python3 tools/audit-checks/check_route_targets.py 2>&1 | tail -n +4 || true)
          if echo "$ROUTES" | grep -q '•'; then
            add_section "Route targetFile missing (tblRoutes points at a file that doesn't exist)" "$ROUTES"
          fi

          # 10b) Addresses hidden by a real file or folder in the web root.
          #      A DIFFERENT fault from 10 above: there the file is missing;
          #      here the address and the file are both perfectly correct, and
          #      the web server answers for a same-named folder instead and
          #      never asks the portal. Nothing reaches the error log, so it is
          #      invisible until somebody clicks the link. Caught the whole
          #      Admin area being unreachable (#483) and a public, sign-in-free
          #      address being hidden (#478).
          SHADOW=$(python3 tools/audit-checks/check_webroot_shadowing.py 2>&1 || true)
          if echo "$SHADOW" | grep -q '•'; then
            add_section "Addresses hidden by a real file or folder in the web root (the portal never runs)" "$SHADOW"
          fi

          # 10c) Web addresses ending in .php. Broken AND a giveaway: .htaccess
          #      answers 404 for every one of them, so such a link simply does
          #      not work, while the page it sits on looks perfectly normal.
          #      Caught three live Expenses forms (submit, approve, treasury)
          #      that would have shown "page not found" on Save, and the upgrade
          #      page redirecting to a 404 on an expired form token.
          PHPURL=$(python3 tools/audit-checks/check_no_php_in_urls.py 2>&1 || true)
          if echo "$PHPURL" | grep -q '•'; then
            add_section "Web addresses ending in .php (broken, and they reveal what the site is built with)" "$PHPURL"
          fi

          # 10d) Personal data with no decision recorded. Somebody has two
          #      rights over their own information: a copy of it, and its
          #      deletion. Both need an accurate list of where it lives. That
          #      list used to be remembered rather than written down, and when
          #      it was finally measured, 77 of the 126 tables holding personal
          #      data were in neither the deletion list nor the download -
          #      including a child's medical notes. This fails when a new table
          #      appears that nobody has sorted.
          PDATA=$(python3 tools/audit-checks/check_personal_data_coverage.py 2>&1 || true)
          if echo "$PDATA" | grep -q '•'; then
            add_section "Personal data with no decision recorded (erasure and download would both miss it)" "$PDATA"
          fi

          # 10e to 10h, 12b and 14b joined on 13 October 2026. All six are
          #      REPORT-ONLY: each puts what it found in the comment and
          #      blocks nothing. They are wired like check 9 above (the exit
          #      code is kept, and a run that did not finish gets its own
          #      heading), NOT like the "look for a bullet" blocks around
          #      them, for two reasons seen by running them:
          #        - 10e prints bullets on a CLEAN run as well (the four lines
          #          allowed to stay bare, each with its reason), so "a bullet
          #          means a finding" would have put a false finding in every
          #          comment;
          #        - a check that stops on an error prints a traceback and no
          #          bullet, which that shape reads as a clean run.
          #      So each one's verdict is its EXIT CODE, and a failing exit
          #      code counts as "findings" only when the output also holds
          #      the line that check prints at the end of a finished run.
          #      Anything else that is not 0 is headed "did not finish".
          #      `set +e` at the top of this step means a failing check does
          #      not stop it, so none of these needs "|| true".
          #      WHAT THESE CANNOT DO: run on a pull request that changes
          #      neither a PHP file under web/ nor anything under web/_sql/.
          #      This whole step leaves early on such a pull request (see the
          #      top of it), so a change to a script file or a workflow alone
          #      is not read by any of them here. A change to documents alone
          #      is read by 10f and 14b, the two that read documents, and by
          #      no other.

          # 10e) Addresses written without the address builder (#536): a bare
          #      "/page" drops the organisation's part of the address, so it
          #      lands on the default organisation. Exit 0 clean; 1 a bare
          #      address, or something the check could not read in full.
          SITEADDR=$(python3 tools/audit-checks/check_site_aware_addresses.py 2>&1)
          SITEADDR_RC=$?
          if [[ "$SITEADDR_RC" -eq 1 ]] && echo "$SITEADDR" | grep -a -q '^FAILED .* see above\.$'; then
            add_section "Addresses written without the address builder (they drop the organisation's part of the address), or a place the check could not read" "$SITEADDR"
          elif [[ "$SITEADDR_RC" -ne 0 ]]; then
            add_section "check_site_aware_addresses.py did not finish (exit code $SITEADDR_RC): its findings, if any, are unknown" "${SITEADDR:-(the script printed nothing at all)}"
          fi

          # 10f) A web address of ours built into the product (#500): the
          #      function near the top of this step.
          block_10f_an_address_of_ours

          # 10g) Files an installation package may not hold (#499). Reads what
          #      git holds under web/ at this commit and applies the package's
          #      own rules about names, kinds, places and contents, with its
          #      deny list. It builds nothing, so the guards that need a built
          #      package (the search for secrets among them) do not run here.
          #      Exit 0 pass; 1 fail. A finished run's LAST line says "the run
          #      reached its end".
          PKGTREE=$(python3 tools/package/check-package.py --tree web 2>&1)
          PKGTREE_RC=$?
          if [[ "$PKGTREE_RC" -eq 1 ]] && echo "$PKGTREE" | tail -n 1 | grep -a -q 'the run reached its end'; then
            add_section "Files under web/ that an installation package may not hold" "$PKGTREE"
          elif [[ "$PKGTREE_RC" -ne 0 ]]; then
            add_section "check-package.py --tree web did not finish (exit code $PKGTREE_RC): its findings, if any, are unknown" "${PKGTREE:-(the script printed nothing at all)}"
          fi

          # 10h) Addresses written out whole that nothing answers: a link, a
          #      form or a redirect to an address the portal does not
          #      register. The mistake is in what a page points AT, so every
          #      file can exist and every address be registered while the
          #      link still leads nowhere. Exit 0 clean; 1 a finding or a
          #      problem.
          REGADDR=$(python3 tools/audit-checks/check_registered_addresses.py 2>&1)
          REGADDR_RC=$?
          if [[ "$REGADDR_RC" -eq 1 ]] && echo "$REGADDR" | grep -a -q '^FAILED .* see above\.$'; then
            add_section "Addresses written out that nothing answers (the link, form or redirect leads nowhere)" "$REGADDR"
          elif [[ "$REGADDR_RC" -ne 0 ]]; then
            add_section "check_registered_addresses.py did not finish (exit code $REGADDR_RC): its findings, if any, are unknown" "${REGADDR:-(the script printed nothing at all)}"
          fi

          # 11) Settings key consistency (catches the class #203/#208 were
          #     filed under; both turned out to be FP but this script
          #     walks the entire schema so it won't repeat the agent's miss)
          SETTINGS=$(python3 tools/audit-checks/check_settings_keys.py 2>&1 | tail -n +5 || true)
          if echo "$SETTINGS" | grep -qE '•.*no fallback'; then
            UNGUARDED=$(echo "$SETTINGS" | sed -n '/UNGUARDED/,/###\|^$/p')
            add_section "Unseeded settings reads (UNGUARDED — null on missing key)" "$UNGUARDED"
          fi

          # 12) full_schema.sql fresh-install parity (#364 / #194 / #339)
          PARITY=$(python3 tools/audit-checks/check_schema_seed_parity.py 2>&1 | tail -n +6 || true)
          if echo "$PARITY" | grep -q '•'; then
            add_section "full_schema.sql parity gaps (migration seeds/marks missing from fresh-install schema)" "$PARITY"
          fi

          # 12b) A secret stored as readable text in the install script or a
          #      migration (#497). A seeded secret must be empty, and no seed
          #      may overwrite a stored one when it is run again. Wired like
          #      10e above. With --strict: exit 0 nothing found; 1 a finding
          #      (and it then prints its count line), or a file it could not
          #      read (no count line, so that is headed "did not finish").
          SEEDS=$(python3 tools/audit-checks/check_sensitive_seeds.py --strict 2>&1)
          SEEDS_RC=$?
          if [[ "$SEEDS_RC" -eq 1 ]] && echo "$SEEDS" | grep -a -q '^check_sensitive_seeds: read .* finding(s)\.$'; then
            add_section "A secret stored as readable text in a seed, or a seed that would overwrite a stored secret" "$SEEDS"
          elif [[ "$SEEDS_RC" -ne 0 ]]; then
            add_section "check_sensitive_seeds.py did not finish (exit code $SEEDS_RC): its findings, if any, are unknown" "${SEEDS:-(the script printed nothing at all)}"
          fi

          # 13) MariaDB-only DDL syntax (#<fix-issue> — MySQL 8 rejects with error 1064)
          MARIADB=$(python3 tools/audit-checks/check_mariadb_only_ddl.py 2>&1 | tail -n +3 || true)
          if echo "$MARIADB" | grep -q '•'; then
            add_section "MariaDB-only DDL in web/_sql (MySQL 8 error 1064 — use the information_schema guard idiom)" "$MARIADB"
          fi

          # 14) PHP table-reference existence (tblX in PHP resolves to a
          #     CREATE TABLE in full_schema.sql — catches the class of bug
          #     that let the GDPR eraser silently skip a real table)
          PHP_TABLE_REFS=$(python3 tools/audit-checks/check_php_table_refs.py 2>&1 | tail -n +3 || true)
          if echo "$PHP_TABLE_REFS" | grep -q '•'; then
            add_section "PHP references to tables not in full_schema.sql" "$PHP_TABLE_REFS"
          fi

          # 14b) A document under docs/ that names a table that does not
          #      exist: the function near the top of this step.
          block_14b_documents_naming_tables

          # 15) mysqli bind_param() arity (#433 — catches an uncaught
          #     ValueError on PHP 8 when the type-string length doesn't
          #     match the bound-argument count)
          BIND_ARITY=$(python3 tools/audit-checks/check_bind_param_arity.py 2>&1 | tail -n +3 || true)
          if echo "$BIND_ARITY" | grep -q '•'; then
            add_section "mysqli bind_param() arity mismatches (fatal ValueError on PHP 8)" "$BIND_ARITY"
          fi

          # 16) Third-party library tags loaded from a public CDN without an
          #     integrity="sha384-..." hash. Without that hash, a tampered file
          #     on the CDN would run in every visitor's browser unnoticed.
          CDN_SRI=$(python3 tools/audit-checks/check_cdn_sri.py 2>&1 | tail -n +3 || true)
          if echo "$CDN_SRI" | grep -q '•'; then
            add_section "CDN tags with no integrity hash (a tampered CDN file would run unnoticed)" "$CDN_SRI"
          fi

          # 17) Migrations that would fail or duplicate data if run a second
          #     time. The installer replays every migration on top of
          #     full_schema.sql, so every one has to be safe to re-run. The
          #     Docker end-to-end harness proves this against a real MySQL,
          #     but only when web/_sql/ changes; this static check runs on
          #     every pull request and is far quicker.
          MIG_IDEMPOTENCY=$(python3 tools/audit-checks/check_migration_idempotency.py 2>&1 | tail -n +3 || true)
          if echo "$MIG_IDEMPOTENCY" | grep -q '•'; then
            add_section "Migrations that are not safe to run twice" "$MIG_IDEMPOTENCY"
          fi

          # 18) Small-screen problems that can be spotted without a device:
          #     a missing viewport tag, hard-coded wide pixel widths, and so on.
          MOBILE=$(python3 tools/audit-checks/check_mobile_readiness.py 2>&1 | tail -n +3 || true)
          if echo "$MOBILE" | grep -q '•'; then
            add_section "Mobile readiness (static checks only — a real device walk-through is still needed)" "$MOBILE"
          fi

          # 19) The browser's raw confirm() dialog instead of the portal's own
          #     themed confirmation. The raw one cannot be styled, ignores the
          #     dark theme, and is blocked outright by some browsers.
          NATIVE_CONFIRM=$(python3 tools/audit-checks/check_no_native_confirm.py 2>&1 | tail -n +3 || true)
          if echo "$NATIVE_CONFIRM" | grep -q '•'; then
            add_section "Native confirm() used instead of the portal's data-confirm modal" "$NATIVE_CONFIRM"
          fi

          # 20) A call to a method that does not exist, a call with no arguments
          #     to a method that needs some, or a core class used without an
          #     import. Each is a fatal error when that line runs, and nothing
          #     else here reads a method name (#494). Only the finding lines and
          #     their headings go into the comment - the script's coverage
          #     figures and its long explanation of what it cannot check would
          #     bury the one line that matters.
          STATIC_CALLS=$(python3 tools/audit-checks/check_static_calls.py 2>&1 || true)
          # grep -a: treat the check's output as text even if a line holds a byte that is not valid UTF-8.
          # Without it, GNU grep prints 'binary file matches' instead of the finding line, and the finding
          # never reaches the report (found 13 September 2026 while fixing the wrapper's output handling).
          if echo "$STATIC_CALLS" | grep -a -q '•'; then
            add_section "Calls to methods that do not exist, or core classes used with no import (a fatal error the moment that line runs)" "$(echo "$STATIC_CALLS" | grep -a -E '^[[:space:]]*•|^###')"
          fi

          # 21) A change to an account or to the access it carries (a password,
          #     the on/off switch, a membership, the portal-wide administrator
          #     flag, an offboarding, a safeguarding record) written without
          #     asking AccountGuard first. That is the shape of #518, where an
          #     administrator of one organisation could change any account in
          #     the whole installation. The check has its own short allow list,
          #     with a reason for each entry, and also reports an allow-list
          #     entry that no longer matches anything.
          ACCOUNT_GUARD=$(python3 tools/audit-checks/check_account_writes_guarded.py 2>&1 | tail -n +4 || true)
          if echo "$ACCOUNT_GUARD" | grep -q '•'; then
            add_section "Account or access changes written without asking AccountGuard (the #518 shape)" "$ACCOUNT_GUARD"
          fi

          # 22) Events read without the visibility rule or the imported-event
          #     refusal (#514). #514 gave the portal one shared rule for who
          #     may see an event (Portal\Core\EventVisibility) and made every
          #     event copied in from an outside calendar read-only everywhere
          #     else (D5). Neither is enforced by the database, so this flags
          #     any line reading tblEvents with neither EventVisibility:: nor
          #     an "externalFeedID IS [NOT] NULL" refusal nearby.
          #     Reported in the PR comment only; not a hard gate.
          EVENT_VISIBILITY=$(python3 tools/audit-checks/check_event_visibility.py 2>&1 | tail -n +3 || true)
          if echo "$EVENT_VISIBILITY" | grep -q '•'; then
            add_section "Events read without the visibility rule or the imported-event refusal (#514)" "$EVENT_VISIBILITY"
          fi

          echo "hits=$HITS" >> "$GITHUB_OUTPUT"
          echo "scope=all" >> "$GITHUB_OUTPUT"
          echo "Total finding sections: $HITS"

          if [[ -s "$REPORT" ]]; then
            cat "$REPORT"
          fi

      # =====================================================================
      # 23) Links between tables that point at something other than a real
      #     key (#552). Deliberately its OWN step, not folded into the
      #     "Heuristic anti-pattern scan" step above: that step exits
      #     early — skipping checks 9-22 — on a pull request that changes
      #     neither a PHP file under web/ nor anything under web/_sql/
      #     (see the two "if" blocks near its top that end in "exit 0";
      #     until #556 it left on any pull request with no PHP change).
      #     A bad link between tables is most often introduced by a
      #     migration with no PHP change at all. That early exit no longer
      #     skips such a pull request, but this check stays out of its
      #     reach all the same, so that no later change to it can skip
      #     this one (the owner approved "every pull request" for this
      #     one specifically). This step never looks at which files
      #     changed.
      #
      #     Wired the same way as check 9 above, and for the same reason:
      #     the exit code is kept and none of the output is thrown away.
      #     Without --strict (not passed here) the script exits 0 with or
      #     without findings, so any other exit code means it did not
      #     finish: 1 is a crash (a Python traceback), 2 is its own
      #     refusal when full_schema.sql or a migration file is missing,
      #     cannot be read, or holds a byte that is not valid UTF-8.
      #     Neither of those prints a bullet, so checking for a bullet
      #     alone would report both as a clean run. grep -a for the same
      #     reason as check 20 above.
      # =====================================================================
      # No continue-on-error here: it is not needed. The script below starts
      # with `set +e` and never ends with an explicit non-zero `exit`, so
      # this step always finishes with a success status on its own —
      # proved by running it against a crashing copy of the script and a
      # missing-schema tree, and both still ended the step at exit 0. (This
      # used to say that was done "under GitHub's own default shell
      # (`bash -eo pipefail`)". That is the shell for a step that NAMES
      # bash; with no shell named, as in this file, GitHub uses `bash -e`.
      # On 13 October 2026 the step's lines were run again under both.)
      #
      # `if: ${{ !cancelled() }}` — added in fix round 1 of the workflow
      # package (25 September 2026). Without it this step used GitHub's
      # default condition, `success()`, so a failure in an EARLIER step (the
      # PHP lint hard gate above, the checkout step, or the gitleaks SARIF
      # upload) skipped this one too — the exact thing the comment above
      # says this check must never do ("putting this check behind that same
      # early exit would skip it on exactly the pull requests it matters
      # most for"). Proved by simulation: with the PHP lint step made to
      # fail, this step was skipped, its `hits` output was never set, and
      # the job summary line below then showed an EMPTY count next to the
      # words "never skipped" — a skip that looked exactly like a clean
      # run. `!cancelled()` runs this step whatever happened earlier, and
      # only skips it if the whole workflow run itself was cancelled.
      - name: Foreign-key target check (#552, check 23 — runs on every PR, even if an earlier step failed)
        id: check23
        if: ${{ !cancelled() }}
        run: |
          set +e
          REPORT=/tmp/security-report-check23.md
          : > "$REPORT"
          HITS=0

          FK_TARGETS=$(python3 tools/audit-checks/check_fk_references_unique_key.py 2>&1)
          FK_RC=$?
          if [[ "$FK_RC" -ne 0 ]]; then
            {
              echo "### check_fk_references_unique_key.py did not finish (exit code $FK_RC): its findings, if any, are unknown"
              echo
              echo '```'
              echo "${FK_TARGETS:-(the script printed nothing at all)}"
              echo '```'
              echo
            } >> "$REPORT"
            HITS=1
          elif echo "$FK_TARGETS" | grep -a -q '•'; then
            {
              echo "### Links between tables that point at an ordinary index instead of a primary or unique key (MySQL 8.4 refuses them: ERROR 6125)"
              echo
              echo '```'
              echo "$FK_TARGETS"
              echo '```'
              echo
            } >> "$REPORT"
            HITS=1
          fi

          echo "hits=$HITS" >> "$GITHUB_OUTPUT"
          echo "check 23 finding sections: $HITS"
          if [[ -s "$REPORT" ]]; then
            cat "$REPORT"
          fi

      # =====================================================================
      # Check 24 (#577): can the portal's own backup carry every column and
      # link in the install script, and does a snapshot obey its two schema
      # files? Report-only, like check 23, and for the same reason it runs on
      # every pull request even after an earlier step failed: the fault this
      # exists for was caused by a new column in a table nobody thought of as
      # part of the backup, in a pull request that changed no backup code.
      #
      # The script's exit codes: 0 nothing found; 1 something found (and it
      # then prints a line saying how many problems); 2 it could not read a
      # file it needs. Anything else is reported as "did not finish", so a
      # crash can never be read as a clean run. That includes exit code 1
      # WITHOUT that line, which is what Python itself gives a script that
      # stopped on an error: its traceback is not a list of findings and is
      # not headed as one.
      #
      # No continue-on-error: the script below starts with `set +e` and never
      # ends with a non-zero `exit`, so this step always finishes with a
      # success status. (The workflow that turns RED on a backup fault is
      # backup-selftest.yml; this step only puts the finding in the comment.)
      # =====================================================================
      - name: Backup column-type check (#577, check 24 — runs on every PR, even if an earlier step failed)
        id: check24
        if: ${{ !cancelled() }}
        run: |
          set +e
          REPORT=/tmp/security-report-check24.md
          : > "$REPORT"
          HITS=0

          BACKUP_TYPES=$(python3 tools/audit-checks/check_backup_column_types.py --strict 2>&1)
          BACKUP_RC=$?
          if [[ "$BACKUP_RC" -eq 1 ]] && echo "$BACKUP_TYPES" | grep -a -q "problem(s) with what the portal's own backup can carry"; then
            {
              echo "### Columns or links the portal's own backup cannot carry, or a snapshot format that no longer matches its schema"
              echo
              echo '```'
              echo "$BACKUP_TYPES"
              echo '```'
              echo
            } >> "$REPORT"
            HITS=1
          elif [[ "$BACKUP_RC" -ne 0 ]]; then
            {
              echo "### check_backup_column_types.py did not finish (exit code $BACKUP_RC): its findings, if any, are unknown"
              echo
              echo '```'
              echo "${BACKUP_TYPES:-(the script printed nothing at all)}"
              echo '```'
              echo
            } >> "$REPORT"
            HITS=1
          fi

          echo "hits=$HITS" >> "$GITHUB_OUTPUT"
          echo "check 24 finding sections: $HITS"
          echo "$BACKUP_TYPES" | tail -3
          if [[ -s "$REPORT" ]]; then
            cat "$REPORT"
          fi

      # =====================================================================
      # Post a single summary comment back to the PR
      #
      # Runs whenever there is anything to say: either the heuristic step
      # (checks 9-22) did not leave early (it leaves early, and so skips
      # this comment too, on a pull request that changes no PHP or SQL file
      # under web/ and no document), OR check 23 or check 24
      # above found something — both run on every PR, even after an earlier
      # step failed (see their own `if:` above), so either can have a
      # finding even when the heuristic step skipped itself entirely. Check
      # 24 is tested with `== '1'` for the reason given below for check 23.
      #
      # IT SAYS ONLY WHAT HAPPENED (13 October 2026). This comment used to
      # open with "No heuristic findings on the files changed in this PR"
      # whenever the count was 0, and the count is also 0 when the scan
      # NEVER RAN: after a failed PHP lint the scan is skipped, while this
      # step, which runs always, still posted that line. A check that did
      # not run had been reported as a pass. The scan's own outcome, and
      # the "scope" it wrote down, now decide the first lines: "did not
      # run", "left early", "only the two checks that read documents ran",
      # or nothing extra when every check ran.
      #
      # `steps.check23.outputs.hits == '1'`, not `!= '0'` — tightened in fix
      # round 1 of the workflow package (25 September 2026). Check 23's own
      # step (above) only ever writes the literal string `0` or `1` to this
      # output — see its `HITS=0` / `HITS=1` — so `== '1'` is the exact test
      # for "check 23 found something". `!= '0'` reads as "found something"
      # but is really "found something OR check 23 did not set an output at
      # all" (an output that was never set is not `'0'` either), which is
      # exactly what "the step was skipped" looks like — for example on a
      # cancelled run. `== '1'` gives the right answer whether GitHub reads
      # a never-set output as empty or as null, so "never ran" can never be
      # misread as "has findings".
      # =====================================================================
      - name: Post findings to PR
        if: always() && (steps.heuristics.outputs.no_changes != 'true' || steps.check23.outputs.hits == '1' || steps.check24.outputs.hits == '1')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEURISTIC_HITS: ${{ steps.heuristics.outputs.hits }}
          HEURISTIC_OUTCOME: ${{ steps.heuristics.outcome }}
          HEURISTIC_SCOPE: ${{ steps.heuristics.outputs.scope }}
          CHECK23_HITS: ${{ steps.check23.outputs.hits }}
          CHECK24_HITS: ${{ steps.check24.outputs.hits }}
        run: |
          REPORT=/tmp/security-report.md
          REPORT23=/tmp/security-report-check23.md
          REPORT24=/tmp/security-report-check24.md
          COMMENT=/tmp/comment.md

          # Total findings = the heuristic step's count (0 if it skipped
          # itself) plus check 23's and check 24's own counts (they always
          # ran).
          HITS=$(( ${HEURISTIC_HITS:-0} + ${CHECK23_HITS:-0} + ${CHECK24_HITS:-0} ))

          # What the heuristic scan did, in words. Empty when every check in
          # it ran, which is the only case where "no findings" is the whole
          # truth. "success" is the one outcome that means the step ran:
          # anything else (skipped, cancelled, failure) means it did not
          # reach its end.
          SCAN_WORDS=""
          if [[ "$HEURISTIC_OUTCOME" != "success" ]]; then
            SCAN_WORDS="🛑 **The heuristic scan (checks 3 to 22) DID NOT RUN on this pull request.** An earlier step of the job failed, or the run was cancelled: open the run to see which. Nothing in this comment says anything about those checks."
          elif [[ "$HEURISTIC_SCOPE" == "none" ]]; then
            SCAN_WORDS="ℹ️ The heuristic scan (checks 3 to 22) left early: this pull request changes no PHP or SQL file under \`web/\` and no document, so none of those checks ran."
          elif [[ "$HEURISTIC_SCOPE" == "documents" ]]; then
            SCAN_WORDS="ℹ️ Only documents changed in this pull request, so only the two checks that read documents ran (10f, a web address of ours; 14b, a document naming a table that does not exist). The other heuristic checks did not run."
          fi

          {
            echo "## PR Security Checks"
            echo
            if [[ -n "$SCAN_WORDS" ]]; then
              echo "$SCAN_WORDS"
              echo
            fi
            if [[ "$HITS" == "0" && -z "$SCAN_WORDS" ]]; then
              echo "✅ No heuristic findings on the files changed in this PR."
            elif [[ "$HITS" == "0" ]]; then
              echo "✅ The checks that did run found nothing."
            else
              echo "⚠️ **${HITS} category(ies) of findings** — these are heuristics, please review each:"
              echo
              if [[ -s "$REPORT" ]]; then
                cat "$REPORT"
              fi
              if [[ -s "$REPORT23" ]]; then
                cat "$REPORT23"
              fi
              if [[ -s "$REPORT24" ]]; then
                cat "$REPORT24"
              fi
            fi
            echo
            echo "<sub>Generated by \`.github/workflows/pr-security.yml\`. These checks are non-blocking on the merge gate; PHP lint and the account-change guard are the hard gates. False positives are expected — confirm before acting.</sub>"
          } > "$COMMENT"

          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file "$COMMENT"

      # =====================================================================
      # Account-change guard — HARD GATE (Codex catch-up A3, 20 September 2026)
      #
      # Step 21 above runs the same check for the PR comment, but inside a
      # step that never fails and with its exit code thrown away
      # ("|| true"), so a real finding could never fail the build — even
      # though the check documents itself as always-blocking. This step runs
      # it again with the exit code honoured. It sits after the comment is
      # posted so the comment still names the file and line, and runs even
      # when an earlier step failed so its verdict is always in the log.
      # =====================================================================
      - name: Account-change guard (hard gate)
        id: account_guard
        if: always()
        run: python3 tools/audit-checks/check_account_writes_guarded.py

      # =====================================================================
      # Only ONE place may judge the PHP version (#640) — hard gate.
      #
      # A hard gate rather than a comment line, for the same reason the
      # account-change guard is one: the thing it protects is a SECURITY
      # judgement, and a second copy of it can disagree with the first, so the
      # portal would tell a customer on one page that their PHP is fine and on
      # another that it is not. There is nothing to weigh up and no false
      # positive worth tolerating — the fix is always "ask PhpRuntime".
      #
      # This was added in the same breath as the check itself, because a review
      # pointed out that writing a check and not wiring it up leaves a file
      # that looks like a guard and guards nothing.
      # =====================================================================
      - name: One place decides the PHP version (hard gate)
        id: php_version_one_place
        if: always()
        run: python3 tools/audit-checks/check_php_version_one_place.py

      # =====================================================================
      # Ten checks that guarded something already found broken once, and ran
      # NOWHERE until 28 October 2026 (#646)
      # =====================================================================
      # Every one of these exists because the thing it watches was found broken
      # at least once. None of them was invoked by any workflow, so somebody
      # could have reintroduced any of those faults and nothing in CI would have
      # objected. All ten pass locally today, so all ten go in as HARD GATES, as
      # the owner chose on 28 October 2026 ("hard gates where green").
      #
      # Each has its own `id` and `if: always()` so one failing does not hide
      # the rest, matching the steps above. A step added but skipped by its `if:`
      # looks wired and is not — this repository has had that shape of fault
      # before (a `|| true` meant a check documented as always-blocking could
      # never fail the build), which is why none of these carries `|| true`.

      # Every two-factor gate takes the sign-in away FIRST. This guards the
      # sign-in bypass fixed on 27 October 2026, where a gate granted an
      # identity before the check that earns it, so `?redirect[]=x` left
      # somebody signed in who was never asked for a code — on the password
      # form. Its own note says TWO checks are needed because neither catches
      # the other's half: this one watches the ORDER, section Z of
      # two-step-selftest.php watches the behaviour, and REVERSING THE ORDER
      # ALONE IS INVISIBLE TO THE SELF-TEST. That was measured, not assumed.
      # So the half that catches a re-reversal is this one, and until now it
      # ran nowhere (#646). A hard gate: there is nothing to weigh up and the
      # fix is always the same.
      - name: 'Every two-factor gate takes the sign-in away first (hard gate, #646)'
        # 🔤 NOT `2fa_gate_order`: a step id must start with a letter or an
        #    underscore, and `steps.2fa_gate_order.outcome` is not valid
        #    expression syntax either, so nothing could ever read the result.
        #    It was the only id in any workflow here beginning with a digit,
        #    and the downside was the whole of pr-security.yml being rejected.
        id: twofa_gate_order
        if: always()
        run: python3 tools/audit-checks/check_2fa_gate_order.py

      # A page that writes more than once must hand back the replacement
      # anti-forgery token, because accepting one replaces it (#634).
      - name: 'A page that writes twice hands back the replacement form token (hard gate, #646)'
        id: csrf_rotation_returned
        if: always()
        run: python3 tools/audit-checks/check_csrf_rotation_returned.py

      # A column an erasure must clear has to accept being emptied (#626).
      - name: 'A column an erasure must clear can be emptied (hard gate, #646)'
        id: erasure_columns_nullable
        if: always()
        run: python3 tools/audit-checks/check_erasure_columns_nullable.py

      # An inline script without the answer's nonce is REFUSED by the browser
      # and nothing is logged, so the page looks finished and the control does
      # nothing (#625). Paired with page-scripts-selftest.php, now also wired.
      - name: 'Every inline script carries the answer''s own nonce (hard gate, #646)'
        id: inline_scripts_have_nonce
        if: always()
        run: python3 tools/audit-checks/check_inline_scripts_have_nonce.py

      # The mail library must reach for nothing of the portal (#592).
      - name: 'The mail library reaches for nothing of the portal (hard gate, #646)'
        id: maillib_stands_alone
        if: always()
        run: python3 tools/audit-checks/check_maillib_stands_alone.py

      # A membership question must be scoped to one organisation (#502, #511).
      - name: 'Every membership question is scoped to one organisation (hard gate, #646)'
        id: membership_queries_scoped
        if: always()
        run: python3 tools/audit-checks/check_membership_queries_scoped.py

      # An organisation may not take a key the portal reserves.
      - name: 'No organisation takes a key the portal reserves (hard gate, #646)'
        id: reserved_site_keys
        if: always()
        run: python3 tools/audit-checks/check_reserved_site_keys.py

      # A role key must be one the portal really has.
      - name: 'Every role key is one the portal really has (hard gate, #646)'
        id: role_keys
        if: always()
        run: python3 tools/audit-checks/check_role_keys.py

      # Never store `session_id()` or the whole `$_SESSION` in a record (#622).
      - name: 'No record stores a session identifier or a whole session (hard gate, #646)'
        id: session_id_not_stored
        if: always()
        run: python3 tools/audit-checks/check_session_id_not_stored.py

      # A long job must set its own time limit rather than inherit one.
      - name: 'A long job sets its own time limit (hard gate, #646)'
        id: time_limit_calls
        if: always()
        run: python3 tools/audit-checks/check_time_limit_calls.py

      # Nothing under web/ may ask another website to draw a QR picture (#623).
      # The rule existed for PHP and had no guard for JavaScript, which is how
      # the noticeboard bundle's api.qrserver.com fallback went unnoticed. It is
      # unreachable only because the noticeboard page hands the board the
      # portal's own address; this also checks that guard is still there.
      - name: 'No KNOWN outside QR service is reachable (hard gate, #623)'
        id: no_outside_qr_service
        if: always()
        run: python3 tools/audit-checks/check_no_outside_qr_service.py

      # Every page that writes its own <head> must also write the description,
      # canonical address and preview card (#569). Those pages are the ones a
      # stranger sees — the sign-in page and the public forms — and before #569
      # none of them wrote any of it, so a shared link showed as a bare
      # address. This also guards header.php's own require, which hundreds of
      # ordinary pages depend on and which no page-by-page check would notice.
      # Its partner is tools/page-head-selftest.php, which fetches real pages.
      - name: 'Pages write the shared head tags (hard gate, #569)'
        id: page_head_tags
        if: always()
        run: python3 -I tools/audit-checks/check_page_head_tags.py

      # The API description must agree with the code that answers it (#641).
      # Nothing had ever compared the two, so they drifted for as long as the
      # file existed: 17 endpoints that answer real requests appeared nowhere
      # in it, two more were described only under their api/v1 address, and
      # three operations said in so many words that a legacy address did not
      # exist when it did. The drift is invisible from either
      # file alone - you have to hold both at once, which is what this does.
      # It reads the router's own name pattern and its api/v1 tables, so a
      # helper file such as _coerce.php needs no exemption and a handler
      # reachable only through the REST facade is not cried wolf over.
      - name: 'The API description agrees with the code (hard gate, #641)'
        id: api_spec_matches_code
        if: always()
        run: python3 -I tools/audit-checks/check_api_spec_matches_code.py

      # The test OF that test (#641, #646). The check above is the only thing
      # keeping the API description and the code together, and adding
      # `and False` to any of its conditions leaves it green - measured, not
      # supposed. This plants 18 faults into the real files, requires each to be
      # caught BY THE EXPECTED check, and restores every file byte-for-byte.
      # It is wired here rather than left in an evidence folder because a proof
      # that runs once is not a guard: that is the whole lesson of #646.
      - name: 'That check actually catches things (hard gate, #641)'
        id: api_spec_check_selftest
        if: always()
        run: python3 -I tools/api-spec-check-selftest.py

      # =====================================================================
      # Summary in the Actions UI
      # =====================================================================
      # 📋 The ten gates wired by #646 are deliberately NOT listed one by one
      #    below: the summary would become a wall of names, and a failing step
      #    already shows itself in the Actions list. One line says they ran, so
      #    a reader of the summary can tell the difference between "they all
      #    passed" and "they are not wired", which was the whole problem #646
      #    was about.
      - name: Job summary
        if: always()
        run: |
          {
            echo "### PR Security Checks"
            echo
            # Each line says what its step's own outcome was. "PHP lint" used
            # to be printed as "passed" whatever had happened, and this step
            # runs always, so a failed lint was summed up as a pass.
            echo "- PHP lint: ${{ steps.php_lint.outcome }} (hard gate)"
            echo "- Account-change guard: ${{ steps.account_guard.outcome }} (hard gate)"
            echo "- One place decides the PHP version: ${{ steps.php_version_one_place.outcome }} (hard gate)"
            # Its OWN line, deliberately NOT inside the #646 loop below: this
            # guard is #623's, and adding it there made that loop's label say
            # "the ten guards" over eleven results. This file has been bitten by
            # a stale count before.
            echo "- No known outside QR service is reachable: ${{ steps.no_outside_qr_service.outcome }} (hard gate, #623)"
            echo "- Pages write the shared head tags: ${{ steps.page_head_tags.outcome }} (hard gate, #569)"
            # The ten guards wired by #646, as ONE line unless something failed.
            # Ten separate lines would bury the rest of the summary; what a
            # reader needs is to tell "they all passed" from "they are not
            # wired at all", which is the state #646 was about.
            gates646=""
            for entry in \
              "every two-factor gate takes the sign-in away first:${{ steps.twofa_gate_order.outcome }}" \
              "a page that writes twice returns the form token:${{ steps.csrf_rotation_returned.outcome }}" \
              "a column an erasure clears can be emptied:${{ steps.erasure_columns_nullable.outcome }}" \
              "every inline script carries its nonce:${{ steps.inline_scripts_have_nonce.outcome }}" \
              "the mail library stands alone:${{ steps.maillib_stands_alone.outcome }}" \
              "membership questions are scoped to one organisation:${{ steps.membership_queries_scoped.outcome }}" \
              "no organisation takes a reserved key:${{ steps.reserved_site_keys.outcome }}" \
              "every role key really exists:${{ steps.role_keys.outcome }}" \
              "no record stores a session identifier:${{ steps.session_id_not_stored.outcome }}" \
              "a long job sets its own time limit:${{ steps.time_limit_calls.outcome }}" ; do
              label="${entry%:*}"
              outcome="${entry##*:}"
              if [[ "$outcome" != "success" ]]; then
                gates646="${gates646}  - ${label}: ${outcome}"$'\n'
              fi
            done
            if [[ -z "$gates646" ]]; then
              echo "- The ten guards wired by #646: all passed (hard gates)"
            else
              echo "- The ten guards wired by #646: NOT all passed (hard gates):"
              printf '%s' "$gates646"
            fi
            if [[ "${{ steps.install_gitleaks.outputs.installed }}" == "yes" ]]; then
              echo "- gitleaks: see step output / artifact"
            elif [[ "${{ steps.install_gitleaks.outcome }}" == "success" ]]; then
              echo "- gitleaks: NOT RUN. It could not be installed (see the step \"Install gitleaks CLI\"), so nothing searched this pull request for secrets."
            else
              echo "- gitleaks: NOT RUN. The step that installs it did not run (it was ${{ steps.install_gitleaks.outcome }}: an earlier step failed, or the run was cancelled), so nothing searched this pull request for secrets."
            fi
            if [[ "${{ steps.heuristics.outcome }}" != "success" ]]; then
              echo "- Heuristic scans (checks 3-22): DID NOT RUN (the step was ${{ steps.heuristics.outcome }}: an earlier step failed, or the run was cancelled)"
            elif [[ "${{ steps.heuristics.outputs.no_changes }}" == "true" ]]; then
              echo "- Heuristic scans (checks 9-22): no PHP or SQL file under web/ and no document changed — skipped"
            elif [[ "${{ steps.heuristics.outputs.scope }}" == "documents" ]]; then
              echo "- Heuristic scans: only documents changed, so only the two checks that read documents ran (10f and 14b): ${{ steps.heuristics.outputs.hits }} finding category(ies). The other checks did not run."
            else
              echo "- Heuristic scans (checks 9-22): ${{ steps.heuristics.outputs.hits }} finding category(ies)"
            fi
            echo "- Foreign-key target check (#552, check 23): ${{ steps.check23.outputs.hits }} finding section(s) — runs on every pull request, even when an earlier step failed (blank only if the run was cancelled)"
            echo "- Backup column-type check (#577, check 24): ${{ steps.check24.outputs.hits }} finding section(s) — runs on every pull request, even when an earlier step failed (blank only if the run was cancelled)"
          } >> "$GITHUB_STEP_SUMMARY"

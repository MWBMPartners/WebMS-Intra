#
# PURPOSE
# -------
# Generates / updates CHANGELOG.md from commit messages since the last v* tag
# on push to alpha or beta. Commits the result with [skip ci] so the update
# itself does not retrigger the workflow.
#
# Excludes meta commits (CI bot bumps, [skip ci], changelog updates) from
# the generated section. Per-branch sections use the heading format:
#   ## [VERSION] - YYYY-MM-DD (branch)
# so alpha/beta entries for the same version can coexist.
#
# IMPORTANT: this workflow does NOT run on `main`. The ruleset on main
# requires a PR — the bot's direct push would be rejected with GH013.
# Changelog entries created on alpha/beta propagate to main via the
# normal beta → main merge, so a main-side bot push isn't necessary.
# =============================================================================

# =============================================================================
# THE VERSION NUMBER IS SET AT RELEASE TIME NOW, NOT ON EVERY PUSH
# (the owner, 4 November 2026 — D-024, issues #476, #474, #748)
# =============================================================================
# This used to run on every push to `alpha` and `beta` and write
# `web/_core/version.php` straight to the branch. Three things were wrong with
# that, and the first is why it was raised:
#
#   * IT HAD NOT ACTUALLY RUN SINCE 7 JULY 2026. Three runs in its whole
#     history, the last on `alpha` on 7 July — which is why `alpha` reported
#     1.4.0 while `beta` and `main` reported 1.4.1 (#476). The cause:
#     `auto-merge-alpha.yml` merges pull requests with GitHub's built-in token,
#     and GitHub deliberately does not let a job acting with that token start
#     another job. So the merge never triggered this.
#   * A DIRECT WRITE TO A BRANCH BLOCKS GUARDING IT. A ruleset that requires
#     tests refuses any direct push, so this job and `changelog.yml` were the
#     one thing standing between `alpha`/`beta` and the branch rules #474 asks
#     for. `changelog.yml`'s own header already recorded that shape for `main`
#     ("gets rejected with GH013").
#   * AND THE OBVIOUS FIX DOES NOT WORK: having it open a pull request instead
#     leaves the pull request with NO CHECKS AT ALL, because GitHub starts no
#     workflow for anything the built-in token creates — so it could never
#     merge. Measured before the owner was asked.
#
# So the number is raised ONCE, when a release is prepared, and it travels to
# `main` the way everything else does — through the merge. `package.yml` is what
# makes that impossible to forget: it REFUSES to build a release whose number
# was not raised above the last tag, and says so in words.
#
# WHAT THIS COSTS, said plainly: the number no longer creeps up with every alpha
# push, so `web/_core/version.php` on `alpha` is the number of the last release
# prepared rather than a running count. The owner accepted that, on the view
# that a version number which changes when a release is made is easier to reason
# about.
#
# RUN IT BY HAND when preparing a release: Actions → "Version Bump" → Run
# workflow, against the branch you are preparing. It still works out the bump
# from the branch and the commit messages exactly as before.
# =============================================================================
name: Changelog

on:
  # workflow_dispatch ONLY — see the note above. It used to be
  # `push: branches: [alpha, beta]`.
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this is being run (shown in the run list)'
        required: false
        default: 'preparing a release'

concurrency:
  group: changelog-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest

    # Skip if the triggering commit was a CI automation commit
    # (The old `if: !contains(github.event.head_commit.message, '[skip ci]')`
    #  is gone: there is no head_commit on a workflow_dispatch, so it could
    #  never fire, and a hand-started run is deliberate by definition.)

    steps:
      # -----------------------------------------------------------------------
      # 🚫 NOT AGAINST A GUARDED BRANCH, and this refusal is the design rather
      #    than a limitation.
      #
      #    `alpha`, `beta`, `main` and `release-candidate` require their tests
      #    to pass (#474), and a ruleset that requires tests refuses ANY direct
      #    push — including this job's. Run against one of them, this would
      #    write CHANGELOG.md, try five times and fail with a
      #    push error, which reads like a fault in this job rather than the
      #    rule it ran into.
      #
      #    So it refuses up front and says where to run it instead: a WORKING
      #    branch. The number then travels to the release branches the way
      #    everything else does — through the merge — which is exactly what
      #    D-024 asks for.
      # -----------------------------------------------------------------------
      - name: Refuse to run against a guarded branch
        run: |
          case "${{ github.ref_name }}" in
            alpha|beta|main|release-candidate|rc)
              echo "::error::This cannot write to ${{ github.ref_name }}: that branch requires its tests to pass, and such a rule refuses every direct push (#474). Run this against the WORKING branch you are preparing the release on, then let the number travel through the merge. Or edit web/_core/version.php in that branch's pull request by hand."
              exit 1
              ;;
          esac
          echo "Branch ${{ github.ref_name }} is not a guarded release branch; carrying on."

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # Read current portal version from web/_core/version.php
      # -----------------------------------------------------------------------
      - name: Read current version
        id: version
        run: |
          VERSION_FILE="web/_core/version.php"
          VERSION=$(grep -oP "^return\s*'\K[^']+" "$VERSION_FILE" 2>/dev/null || echo "Unreleased")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      # -----------------------------------------------------------------------
      # Determine commit range (since last v* tag, or all history)
      # -----------------------------------------------------------------------
      - name: Determine commit range
        id: range
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo "")
          if [[ -n "$LAST_TAG" ]]; then
            echo "range=${LAST_TAG}..HEAD" >> "$GITHUB_OUTPUT"
            echo "Range: ${LAST_TAG}..HEAD"
          else
            echo "range=HEAD" >> "$GITHUB_OUTPUT"
            echo "No previous v* tags — using full history"
          fi

      # -----------------------------------------------------------------------
      # Build the entry text and splice into CHANGELOG.md
      # -----------------------------------------------------------------------
      - name: Generate CHANGELOG.md
        id: generate
        env:
          CL_VERSION: ${{ steps.version.outputs.version }}
          CL_RANGE: ${{ steps.range.outputs.range }}
          BRANCH: ${{ github.ref_name }}
        run: |
          DATE=$(date +%Y-%m-%d)
          HEADER="## [${CL_VERSION}] - ${DATE} (${BRANCH})"
          FILTER_OUT='(\[skip ci\]|^chore: bump version|^chore: update changelog)'

          MSGS=$(git log "${CL_RANGE}" --pretty=format:"%s" -- 'web/' 2>/dev/null \
            | grep -vE "$FILTER_OUT" \
            | sort -u \
            | sed '/^$/d' \
            | sed 's/^/- /' || true)

          if [[ -z "$MSGS" ]]; then
            echo "No changelog-worthy commits in range"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Write the entry to a temp file (avoids shell-quoting headaches)
          {
            echo "$HEADER"
            echo "$MSGS"
          } > /tmp/cl_entry.txt

          # Splice into CHANGELOG.md. The Python helper:
          #   - creates the file if missing
          #   - removes any existing section that matches "[VERSION] ... (branch)"
          #   - inserts the new entry right after the top "# Changelog" header
          python3 - "$CL_VERSION" "$BRANCH" <<'PYEOF'
          import os, re, sys
          version, branch = sys.argv[1], sys.argv[2]
          path = 'CHANGELOG.md'
          with open('/tmp/cl_entry.txt', 'r') as f:
              entry = f.read().rstrip() + '\n'

          if not os.path.exists(path):
              with open(path, 'w') as f:
                  f.write('# Changelog\n\n' + entry + '\n')
              sys.exit(0)

          with open(path, 'r') as f:
              content = f.read()

          # Strip any prior section for this version+branch
          pattern = (
              r'## \[' + re.escape(version) + r'\][^\n]*\('
              + re.escape(branch) + r'\)[^\n]*\n(?:(?!^## \[).*\n?)*'
          )
          content = re.sub(pattern, '', content, flags=re.MULTILINE)

          # Insert after the first "# " heading (and following blank line)
          if content.startswith('# '):
              first_nl = content.find('\n')
              insert_at = first_nl + 1
              if content[insert_at:insert_at + 1] == '\n':
                  insert_at += 1
              new = content[:insert_at] + '\n' + entry + '\n' + content[insert_at:]
          else:
              new = entry + '\n' + content

          with open(path, 'w') as f:
              f.write(new)
          PYEOF

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "Updated CHANGELOG.md"

      # -----------------------------------------------------------------------
      # Commit + push with [skip ci]; retry on race with version-bump.yml
      # -----------------------------------------------------------------------
      - name: Commit changelog
        if: steps.generate.outputs.has_changes == 'true'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changelog changes to commit"
            exit 0
          fi

          git commit -m "chore: update changelog for ${{ steps.version.outputs.version }} [skip ci]"

          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${BRANCH}"; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected on attempt $attempt — rebasing and retrying"
            git fetch origin "${BRANCH}"
            git rebase "origin/${BRANCH}"
            sleep $((attempt * 2))
          done

          echo "::error::Failed to push changelog after 5 attempts"
          exit 1

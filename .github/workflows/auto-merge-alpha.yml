#
# PURPOSE
# -------
# Enables GitHub's native "auto-merge" feature on any PR whose base branch
# is `alpha`. GitHub will merge as soon as required status checks pass and
# any required reviews are satisfied. Failed checks leave the PR open.
#
# REQUIREMENTS (one-time repo configuration)
# ------------------------------------------
#   1. Settings -> General -> "Allow auto-merge" must be enabled.
#   2. (Recommended) Branch protection on `alpha` requiring at least one
#      status check, otherwise auto-merge fires immediately with no gate.
#
# MERGE STRATEGY
# --------------
# Squash merge (`--squash`). Change to `--merge` or `--rebase` if preferred.
#
# THE TWO DISPATCH BRIDGES
# ------------------------
# GitHub suppresses workflow triggers for pushes attributed to GITHUB_TOKEN
# (anti-recursion). After auto-merge lands on alpha, this workflow explicitly
# dispatches deploy.yml so the alpha environment updates, AND package.yml so
# the merge gets its installation zip. Anything else that is supposed to
# happen on a merge into alpha needs a line here too — nothing that listens
# for a push to alpha will ever hear these merges.
# =============================================================================

name: Auto-Merge Alpha PRs

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - alpha

permissions:
  contents: write
  pull-requests: write
  actions: write

# Coalesce repeated synchronise events on the same PR
concurrency:
  group: auto-merge-alpha-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable-auto-merge:
    name: Enable auto-merge on alpha PRs
    runs-on: ubuntu-latest

    # Drafts cannot auto-merge — skip them
    if: github.event.pull_request.draft == false

    steps:
      - name: Enable auto-merge (squash)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"

      # ---------------------------------------------------------------------
      # Bridge GitHub's anti-recursion rule: after merge, dispatch deploy.yml
      # explicitly. Polls up to ~60 min and exits cleanly if the PR closes
      # without merging.
      # ---------------------------------------------------------------------
      - name: Wait for merge and dispatch deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            STATE=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json state -q .state)
            case "$STATE" in
              MERGED)
                echo "PR #$PR_NUMBER merged — dispatching deploy.yml on alpha"
                gh workflow run deploy.yml --repo "$REPO" --ref alpha
                # And the installation zip, for the same reason (#499, added
                # 27 October 2026 by the workflow package's fix round). The
                # owner approved "a zip built on every merge into alpha and
                # beta", and package.yml listens for a push to alpha — but
                # the merge above is GitHub's own, so no push event is ever
                # raised and that listener never hears it. Without this line
                # alpha would almost never build a zip: the proof is that
                # version-bump.yml raises the version on every push to alpha
                # that touches web/ or the change log, and in the branch's
                # whole history it has done so twice.
                #
                # A dispatched run BUILDS AND CHECKS ONLY. It cannot publish
                # anything: package.yml's publish job asks for a push to main
                # or rc (package.yml, the "if:" on the publish job), and a
                # dispatch is neither. The zip is kept as a download on the
                # run, which is exactly what alpha is meant to get.
                #
                # Why the failure is swallowed: "gh workflow run" finds a
                # workflow by its file name, and only once that file is on
                # the DEFAULT branch. Until package.yml reaches main this
                # line fails every time, and under "set -e" that would turn
                # this job RED on every alpha merge for a reason that is not
                # a fault — which teaches people to ignore a red bridge job,
                # and the next real failure with it. So it says what happened
                # in a warning and carries on.
                #
                # To be exact about what swallowing it does NOT protect, since
                # the first version of this comment said otherwise: the deploy
                # dispatch above has already been accepted by GitHub by the
                # time this line runs, so a failure here could not have
                # undone or lost it. The guard is about the red mark, not
                # about the deploy.
                #
                # Do not quietly drop this guard once package.yml is on main:
                # the same thing happens again if the file is renamed.
                if ! gh workflow run package.yml --repo "$REPO" --ref alpha; then
                  echo "::warning::Could not start package.yml on alpha, so this merge has no installation zip. Expected until package.yml is on the default branch; after that, check the file name."
                fi
                exit 0
                ;;
              CLOSED)
                echo "PR #$PR_NUMBER closed without merging — skipping deploy"
                exit 0
                ;;
            esac
            echo "PR #$PR_NUMBER state=$STATE (poll $i/120) — sleeping 30s"
            sleep 30
          done
          echo "::error::Timed out waiting for PR #$PR_NUMBER to reach a terminal state"
          exit 1
